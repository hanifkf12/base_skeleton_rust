# cargo-deny configuration: advisories, bans, licenses, sources.
# Run: cargo deny check advisories bans licenses sources

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained (archived 2026-05), no safe upgrade. Transitive via
  # opentelemetry-prometheus-text-exporter. Re-evaluate when the exporter
  # switches away from smartstring.
  { id = "RUSTSEC-2026-0249", reason = "smartstring unmaintained, transitive, no fix available" },
]

[bans]
# Multiple versions of the same crate bloat the binary and hide API drift.
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
